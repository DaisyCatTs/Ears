import net.darkhax.curseforgegradle.TaskPublishCurseForge

plugins {
	// replaces com.matthewprenger.cursegradle 1.4.0, which is unmaintained and cannot run on
	// anything newer than Gradle 7
	id 'net.darkhax.curseforgegradle' version '1.3.33'
}

def target = project.getProperty("target")
def version = file('../version.txt').text.trim()+file("../platform-${target}/version-suffix.txt").text.trim()

def prefix = ""
def artifact = "../platform-${target}/build/libs/ears-${target}-${version}.jar"
def stability = ""
def gameVersions = []
def loaders = []

// Unlike the old plugin, game versions and mod loaders are separate here rather than mixed into a
// single list, which has the happy side effect of making this switch match publish-modrinth's.
switch (target) {
	case "fabric-1.21.11":
		prefix = "FABRIC 1.21.11"
		stability = 'release'
		loaders = ['Fabric', 'Quilt']
		gameVersions = ['1.21.11']
		break
	case "fabric-26.1":
		prefix = "FABRIC 26.1/2"
		stability = 'release'
		loaders = ['Fabric', 'Quilt']
		gameVersions = ['26.1', '26.1.1', '26.1.2', '26.2']
		break
	case "neoforge-1.21.11":
		prefix = "NEOFORGE 1.21.11"
		stability = 'beta'
		loaders = ['NeoForge']
		gameVersions = ['1.21.11']
		break
	case "neoforge-26.1":
		prefix = "NEOFORGE 26.1"
		stability = 'beta'
		loaders = ['NeoForge']
		gameVersions = ['26.1', '26.1.1', '26.1.2', '26.2']
		break
	default:
		throw new Exception("Unknown target ${target}")
}

tasks.register('curseforge', TaskPublishCurseForge) {
	apiToken = project.findProperty('curseApiKey')

	def mainFile = upload('412013', file(artifact))
	mainFile.releaseType = stability
	mainFile.changelog = file('../changelog.html').text
	mainFile.changelogType = 'html'
	mainFile.displayName = "[${prefix}] Ears v${version}"
	gameVersions.each { mainFile.addGameVersion(it) }
	loaders.each { mainFile.addGameVersion(it) }
	// Ears is client-side only; say so rather than letting the plugin infer it from the jar
	mainFile.addJavaVersion('Java 21')
}
