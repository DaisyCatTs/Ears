plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.123'
}

version = file('../version.txt').text.trim()+file('version-suffix.txt').text.trim()
group = 'com.unascribed.ears'
base.archivesName = 'ears-neoforge-1.21.11'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

println('Java: ' + System.getProperty('java.version') + ' JVM: ' + System.getProperty('java.vm.version') + '(' + System.getProperty('java.vendor') + ') Arch: ' + System.getProperty('os.arch'))


neoForge {
    version = project.neo_version
}

dependencies {
    implementation files('../common/build/libs/ears-common-mixin-modern.jar')
}

processResources {
    var expandProps = [
            "version": project.version,
            "loader_version": project.loader_version
    ]
    inputs.properties(expandProps)
    filesMatching("META-INF/neoforge.mods.toml") {
        expand expandProps
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    from zipTree('../common/build/libs/ears-common-mixin-modern.jar')
    from "../LICENSE"
}

// Replaces the ../common/replace-version.sh call, which can't run on Windows. Rewrites the marker
// in place, and only when it changes, so it doesn't dirty compileJava on every build.
tasks.register('stampVersion') {
	def versionFile = file('../version.txt')
	def suffixFile = file('version-suffix.txt')
	def target = file('src/main/java/com/unascribed/ears/EarsPlatformVersion.java')
	inputs.file versionFile
	inputs.property 'suffix', suffixFile.exists() ? suffixFile.text.trim() : ''
	outputs.file target
	doLast {
		def v = versionFile.text.trim() + (suffixFile.exists() ? suffixFile.text.trim() : '')
		def before = target.text
		def after = before.replaceAll(/(?s)\/\*VERSION\*\/.*?\/\*\/VERSION\*\//, '/*VERSION*/"' + v + '"/*/VERSION*/')
		if (before != after) {
			target.text = after
			logger.lifecycle("Stamped version $v into $target.name")
		}
	}
}
tasks.named('compileJava') { dependsOn 'stampVersion' }
