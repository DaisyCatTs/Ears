plugins {
	id 'java-library'
	id 'maven-publish'
	id 'com.gradleup.shadow' version '9.6.1'
}

// NB: deliberately no `version` — the platform ports consume these jars by literal filename
// (e.g. ../common/build/libs/ears-common-mixin-modern.jar), so the archives must stay unversioned.
// The publications below set their version explicitly.

java {
	// Common used to target Java 6 for the pre-1.6 Minecraft ports. Those ports are going away,
	// and 8 is the oldest release a modern JDK will accept.
	sourceCompatibility = JavaVersion.VERSION_1_8
	targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release = 8
}

repositories {
	// Gradle will throw a "helpful" error about the dependencies not supporting Java 6 if not
	// forced to ignore metadata
	maven { url = uri('https://repo1.maven.org/maven2/'); metadataSources { artifact() } }
	maven { url = uri('https://libraries.minecraft.net/'); metadataSources { artifact() } }
	maven { url = uri('https://repo.spongepowered.org/maven/'); metadataSources { artifact() } }
}
configurations {
	agentShade
	vlegacyShade
}
sourceSets {
	api {
		compileClasspath += sourceSets.main.compileClasspath
	}
	normal {
		compileClasspath += sourceSets.api.output
		compileClasspath += sourceSets.api.compileClasspath
	}
	dummy {}
	main {
		compileClasspath += sourceSets.normal.output
		compileClasspath += sourceSets.normal.compileClasspath
		runtimeClasspath += sourceSets.normal.output
		runtimeClasspath += sourceSets.normal.runtimeClasspath
	}
	legacy {
		compileClasspath += sourceSets.main.output
		compileClasspath += sourceSets.main.compileClasspath
		compileClasspath += sourceSets.dummy.output
		runtimeClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.runtimeClasspath
	}
	vlegacy {
		compileClasspath += sourceSets.legacy.compileClasspath
		compileClasspath += sourceSets.legacy.output
		runtimeClasspath += sourceSets.legacy.runtimeClasspath
		runtimeClasspath += sourceSets.legacy.output
	}
	mixin {
		compileClasspath += sourceSets.main.output
		compileClasspath += sourceSets.main.compileClasspath
		runtimeClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.runtimeClasspath
	}
	modern {
		compileClasspath += sourceSets.main.output
		compileClasspath += sourceSets.main.compileClasspath
		runtimeClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.runtimeClasspath
	}
	agent {
		compileClasspath += sourceSets.main.output
		compileClasspath += sourceSets.main.compileClasspath
		compileClasspath += sourceSets.dummy.output
		runtimeClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.runtimeClasspath
	}
	// The protocol oracle: generates the golden fixtures that the TypeScript implementation is
	// tested against. Never shipped — it isn't part of any jar task.
	oracle {
		compileClasspath += sourceSets.api.output
		compileClasspath += sourceSets.main.output
		compileClasspath += sourceSets.normal.output
		runtimeClasspath += sourceSets.api.output
		runtimeClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.normal.output
	}
}

jar {
	from sourceSets.normal.output
	from sourceSets.main.output

	archiveClassifier = ''

	duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

tasks.register('apiJar', Jar) {
	from sourceSets.api.output

	archiveBaseName = 'ears'
	archiveClassifier = 'api'

	duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

tasks.register('apiSourcesJar', Jar) {
	from sourceSets.api.allSource

	archiveBaseName = 'ears'
	archiveClassifier = 'api-sources'

	duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

tasks.register('mixinLegacyJar', Jar) {
	from sourceSets.api.output
	from sourceSets.main.output
	from sourceSets.normal.output
	from sourceSets.mixin.output
	from sourceSets.legacy.output

	archiveClassifier = 'mixin-legacy'

	duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

tasks.register('mixinModernJar', Jar) {
	from sourceSets.api.output
	from sourceSets.main.output
	from sourceSets.normal.output
	from sourceSets.mixin.output
	from sourceSets.modern.output

	archiveClassifier = 'mixin-modern'

	duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

tasks.register('mixinVLegacyJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
	from sourceSets.api.output
	from sourceSets.main.output
	from sourceSets.normal.output
	from sourceSets.legacy.output
	from sourceSets.vlegacy.output
	from sourceSets.mixin.output

	configurations = [project.configurations.vlegacyShade]
	relocate 'com.grack.nanojson', 'com.unascribed.ears.common.legacy.nanojson'
	exclude 'module-info.class'

	archiveClassifier = 'mixin-vlegacy'

	duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

tasks.register('legacyJar', Jar) {
	from sourceSets.api.output
	from sourceSets.main.output
	from sourceSets.normal.output
	from sourceSets.legacy.output

	archiveClassifier = 'legacy'

	duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

tasks.register('vlegacyJar', Jar) {
	from sourceSets.api.output
	from sourceSets.main.output
	from sourceSets.normal.output
	from sourceSets.legacy.output
	from sourceSets.vlegacy.output

	archiveClassifier = 'vlegacy'

	duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

tasks.register('modernJar', Jar) {
	from sourceSets.api.output
	from sourceSets.main.output
	from sourceSets.normal.output
	from sourceSets.modern.output

	archiveClassifier = 'modern'

	duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

tasks.register('agentLegacyJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
	from sourceSets.api.output
	from sourceSets.main.output
	from sourceSets.normal.output
	from sourceSets.legacy.output
	from sourceSets.agent.output

	configurations = [project.configurations.agentShade]
	relocate 'org.objectweb.asm', 'com.unascribed.ears.common.agent.mini.asm'
	exclude 'module-info.class'

	archiveClassifier = 'agent-legacy'

	duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

tasks.register('agentModernJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
	from sourceSets.api.output
	from sourceSets.main.output
	from sourceSets.normal.output
	from sourceSets.modern.output
	from sourceSets.agent.output

	configurations = [project.configurations.agentShade]
	relocate 'org.objectweb.asm', 'com.unascribed.ears.common.agent.mini.asm'
	exclude 'module-info.class'

	archiveClassifier = 'agent-modern'

	duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

tasks.register('agentVLegacyJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
	from sourceSets.api.output
	from sourceSets.main.output
	from sourceSets.normal.output
	from sourceSets.legacy.output
	from sourceSets.vlegacy.output
	from sourceSets.agent.output

	configurations = [project.configurations.agentShade, project.configurations.vlegacyShade]
	relocate 'org.objectweb.asm', 'com.unascribed.ears.common.agent.mini.asm'
	relocate 'com.grack.nanojson', 'com.unascribed.ears.common.legacy.nanojson'
	exclude 'module-info.class'

	archiveClassifier = 'agent-vlegacy'

	duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

tasks.named('build') {
	dependsOn 'apiJar', 'apiSourcesJar'
	dependsOn 'mixinLegacyJar', 'mixinModernJar', 'mixinVLegacyJar'
	dependsOn 'legacyJar', 'vlegacyJar', 'modernJar'
	dependsOn 'agentLegacyJar', 'agentModernJar', 'agentVLegacyJar'
}

dependencies {
	implementation('org.spongepowered:mixin:0.7-SNAPSHOT') {
		transitive = false
	}

	implementation 'org.ow2.asm:asm:9.2'
	implementation 'org.ow2.asm:asm-tree:9.2'
	agentShade 'org.ow2.asm:asm:9.2'
	agentShade 'org.ow2.asm:asm-tree:9.2'
}

// Regenerates the golden protocol fixtures. The output is checked in: re-run this and diff to see
// exactly how a change to the format would affect what Minecraft reads.
tasks.register('fixtures', JavaExec) {
	group = 'verification'
	description = 'Regenerate the golden protocol fixtures in tests/fixtures from the Java implementation'
	classpath = sourceSets.oracle.runtimeClasspath
	mainClass = 'com.unascribed.ears.oracle.Fixtures'
	args file('../tests/fixtures').absolutePath
}

// The other half of the compatibility check: decode skins written by the TypeScript encoder and
// record what Java made of them, for the web test suite to compare against.
tasks.register('decodeTsFixtures', JavaExec) {
	group = 'verification'
	description = 'Decode the TypeScript-encoded fixtures in tests/fixtures-ts with the Java implementation'
	classpath = sourceSets.oracle.runtimeClasspath
	mainClass = 'com.unascribed.ears.oracle.DecodeTsFixtures'
	args file('../tests/fixtures-ts').absolutePath
}

// Replaces replace-version.sh, which can't run on Windows. Rewrites the marker in place, and only
// when it actually changes, so it doesn't dirty compileJava on every build.
tasks.register('stampVersion') {
	def versionFile = file('../version.txt')
	def suffixFile = file('version-suffix.txt')
	def target = file('src/main/java/com/unascribed/ears/common/EarsVersion.java')
	inputs.file versionFile
	inputs.property 'suffix', suffixFile.exists() ? suffixFile.text.trim() : ''
	outputs.file target
	doLast {
		def v = versionFile.text.trim() + (suffixFile.exists() ? suffixFile.text.trim() : '')
		def before = target.text
		def after = before.replaceAll(/(?s)\/\*VERSION\*\/.*?\/\*\/VERSION\*\//, '/*VERSION*/"' + v + '"/*/VERSION*/')
		if (before != after) {
			target.text = after
			logger.lifecycle("Stamped version $v into $target.name")
		}
	}
}
tasks.named('compileJava') { dependsOn 'stampVersion' }

publishing {
	repositories {
		maven {
			url = uri(layout.buildDirectory.dir('maven'))
		}
		if (project.hasProperty("publish-username")) {
			maven {
				url = uri("https://repo-api.sleeping.town/")
				credentials {
					username project.getProperty("publish-username")
					password project.getProperty("publish-password")
				}
			}
		}
	}
	publications {
		api(MavenPublication) {
			groupId = 'com.unascribed'
			artifactId = 'ears-api'
			version = file('../version.txt').text.trim()

			artifact(tasks.named('apiJar')) { classifier = '' }
			artifact(tasks.named('apiSourcesJar')) { classifier = 'sources' }
		}
		common(MavenPublication) {
			groupId = 'com.unascribed'
			artifactId = 'ears-common'
			version = file('../version.txt').text.trim()

			artifact(tasks.named('jar')) { classifier = '' }
			artifact(tasks.named('vlegacyJar')) { classifier = 'vlegacy' }
			artifact(tasks.named('agentVLegacyJar')) { classifier = 'agent-vlegacy' }
			artifact(tasks.named('mixinVLegacyJar')) { classifier = 'mixin-vlegacy' }
			artifact(tasks.named('legacyJar')) { classifier = 'legacy' }
			artifact(tasks.named('agentLegacyJar')) { classifier = 'agent-legacy' }
			artifact(tasks.named('mixinLegacyJar')) { classifier = 'mixin-legacy' }
			artifact(tasks.named('modernJar')) { classifier = 'modern' }
			artifact(tasks.named('agentModernJar')) { classifier = 'agent-modern' }
			artifact(tasks.named('mixinModernJar')) { classifier = 'mixin-modern' }
		}
	}
}
