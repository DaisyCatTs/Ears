plugins {
	id 'java-library'
	id 'maven-publish'
}

// NB: deliberately no `version` — the platform ports consume these jars by literal filename
// (e.g. ../common/build/libs/ears-common-mixin-modern.jar), so the archives must stay unversioned.
// The publications below set their version explicitly.

java {
	// Common used to target Java 6 for the pre-1.6 Minecraft ports. Those ports are gone, and 8 is
	// the oldest release a modern JDK will accept.
	sourceCompatibility = JavaVersion.VERSION_1_8
	targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release = 8
}

repositories {
	maven { url = uri('https://repo1.maven.org/maven2/'); metadataSources { artifact() } }
	maven { url = uri('https://libraries.minecraft.net/'); metadataSources { artifact() } }
	maven { url = uri('https://repo.spongepowered.org/maven/'); metadataSources { artifact() } }
}
sourceSets {
	api {
		compileClasspath += sourceSets.main.compileClasspath
	}
	normal {
		compileClasspath += sourceSets.api.output
		compileClasspath += sourceSets.api.compileClasspath
	}
	main {
		compileClasspath += sourceSets.normal.output
		compileClasspath += sourceSets.normal.compileClasspath
		runtimeClasspath += sourceSets.normal.output
		runtimeClasspath += sourceSets.normal.runtimeClasspath
	}
	mixin {
		compileClasspath += sourceSets.main.output
		compileClasspath += sourceSets.main.compileClasspath
		runtimeClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.runtimeClasspath
	}
	// empty at the moment, so it doesn't show up in git — for code used by 1.13+ (LWJGL3) ports
	modern {
		compileClasspath += sourceSets.main.output
		compileClasspath += sourceSets.main.compileClasspath
		runtimeClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.runtimeClasspath
	}
	// The protocol oracle: generates the golden fixtures the TypeScript implementation is tested
	// against. Never shipped — it isn't part of any jar task.
	oracle {
		compileClasspath += sourceSets.api.output
		compileClasspath += sourceSets.main.output
		compileClasspath += sourceSets.normal.output
		runtimeClasspath += sourceSets.api.output
		runtimeClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.normal.output
	}
}

jar {
	from sourceSets.normal.output
	from sourceSets.main.output

	archiveClassifier = ''

	duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

tasks.register('apiJar', Jar) {
	from sourceSets.api.output

	archiveBaseName = 'ears'
	archiveClassifier = 'api'

	duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

tasks.register('apiSourcesJar', Jar) {
	from sourceSets.api.allSource

	archiveBaseName = 'ears'
	archiveClassifier = 'api-sources'

	duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

tasks.register('modernJar', Jar) {
	from sourceSets.api.output
	from sourceSets.main.output
	from sourceSets.normal.output
	from sourceSets.modern.output

	archiveClassifier = 'modern'

	duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

/** What every supported port consumes. */
tasks.register('mixinModernJar', Jar) {
	from sourceSets.api.output
	from sourceSets.main.output
	from sourceSets.normal.output
	from sourceSets.mixin.output
	from sourceSets.modern.output

	archiveClassifier = 'mixin-modern'

	duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

tasks.named('build') {
	dependsOn 'apiJar', 'apiSourcesJar', 'modernJar', 'mixinModernJar'
}

dependencies {
	// for EarsMixinConfigPlugin, in the mixin source set
	implementation('org.spongepowered:mixin:0.7-SNAPSHOT') {
		transitive = false
	}
}

// Regenerates the golden protocol fixtures. The output is checked in: re-run this and diff to see
// exactly how a change to the format would affect what Minecraft reads.
tasks.register('fixtures', JavaExec) {
	group = 'verification'
	description = 'Regenerate the golden protocol fixtures in tests/fixtures from the Java implementation'
	classpath = sourceSets.oracle.runtimeClasspath
	mainClass = 'com.unascribed.ears.oracle.Fixtures'
	args file('../tests/fixtures').absolutePath
}

// The other half of the compatibility check: decode skins written by the TypeScript encoder and
// record what Java made of them, for the web test suite to compare against.
tasks.register('decodeTsFixtures', JavaExec) {
	group = 'verification'
	description = 'Decode the TypeScript-encoded fixtures in tests/fixtures-ts with the Java implementation'
	classpath = sourceSets.oracle.runtimeClasspath
	mainClass = 'com.unascribed.ears.oracle.DecodeTsFixtures'
	args file('../tests/fixtures-ts').absolutePath
}

// Rewrites the version marker in place, and only when it changes, so it doesn't dirty compileJava
// on every build. Replaces replace-version.sh, which could not run on Windows.
tasks.register('stampVersion') {
	def versionFile = file('../version.txt')
	def suffixFile = file('version-suffix.txt')
	def target = file('src/main/java/com/unascribed/ears/common/EarsVersion.java')
	inputs.file versionFile
	inputs.property 'suffix', suffixFile.exists() ? suffixFile.text.trim() : ''
	outputs.file target
	doLast {
		def v = versionFile.text.trim() + (suffixFile.exists() ? suffixFile.text.trim() : '')
		def before = target.text
		def after = before.replaceAll(/(?s)\/\*VERSION\*\/.*?\/\*\/VERSION\*\//, '/*VERSION*/"' + v + '"/*/VERSION*/')
		if (before != after) {
			target.text = after
			logger.lifecycle("Stamped version $v into $target.name")
		}
	}
}
tasks.named('compileJava') { dependsOn 'stampVersion' }

publishing {
	repositories {
		// Local only. Upstream publishes ears-api to its own Maven; this fork has no business
		// pushing artifacts there, so that repository is deliberately not configured here.
		maven {
			url = uri(layout.buildDirectory.dir('maven'))
		}
	}
	publications {
		api(MavenPublication) {
			groupId = 'com.unascribed'
			artifactId = 'ears-api'
			version = file('../version.txt').text.trim()

			artifact(tasks.named('apiJar')) { classifier = '' }
			artifact(tasks.named('apiSourcesJar')) { classifier = 'sources' }
		}
		common(MavenPublication) {
			groupId = 'com.unascribed'
			artifactId = 'ears-common'
			version = file('../version.txt').text.trim()

			artifact(tasks.named('jar')) { classifier = '' }
			artifact(tasks.named('modernJar')) { classifier = 'modern' }
			artifact(tasks.named('mixinModernJar')) { classifier = 'mixin-modern' }
		}
	}
}
